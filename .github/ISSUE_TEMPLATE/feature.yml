name: 功能建议
description: 提议新功能或改进现有功能
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请重点描述需要解决的问题，而不仅仅是期望采用的技术方案。

  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - 官网与内容管理
        - 用户与权限
        - 成员管理
        - 项目与任务管理
        - 知识库
        - 文件与资产
        - 聊天机器人
        - 插件系统
        - 开发工具
        - 部署与运维
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 当前用户遇到了什么困难？
      placeholder: 作为……，我希望……，从而……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 请描述期望的交互或行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否可以通过现有功能解决？

  - type: dropdown
    id: audience
    attributes:
      label: 主要使用者
      options:
        - 公开访客
        - 普通成员
        - 项目负责人
        - 社团管理者
        - 系统维护者
        - 外部开发者
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过现有 Issue
          required: true
        - label: 我愿意参与后续讨论
          required: true